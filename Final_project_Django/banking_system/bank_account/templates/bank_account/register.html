<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Online Banking</title>

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS for Dark Blue Navbar -->
    <style>
        .navbar-custom {
            background-color: #003366;
        }
        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link {
            color: white;
        }
        .navbar-custom .nav-link:hover {
            color: #ffcc00;
        }
    </style>
</head>
<body class="bg-light">



            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>


    <div class="container mt-5">
        <h1 class="mb-4 text-center">Online Banking System</h1>
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h4 class="mb-4 text-center">Register</h4>

                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <div class="d-grid mt-3">
                                <button type="submit" class="btn" style="background-color: #003366; color: white;">Register</button>
                            </div>
                        </form>

                        <p class="text-center mt-3">
                            Already have an account? <a href="{% url 'login' %}">Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
